:root{
  --bg:#242424;
  --fs:calc(min(7.2vh,10vw) * var(--fs-scale,1));
  --ease:cubic-bezier(.22,1,.36,1);
  --txt-hi:rgba(0,0,0,1);
  --txt-mid:rgba(0,0,0,.44);
  --txt-lo:rgba(0,0,0,.3);
  --txt-xlo:rgba(0,0,0,.28);
  --border:rgba(0,0,0,.5);
  --input-border:rgba(0,0,0,.4);
  --tag-hover:rgba(0,0,0,.1);
}
.deco{
  position:fixed;bottom:0;right:0;
  width:35vw;
  padding:4vw;
  pointer-events:none;
  display:flex;align-items:flex-end;justify-content:flex-end;
}
.deco img{
  display:block;
  max-width:100%;
  max-height:70vh;
  width:auto;height:auto;
  object-fit:contain;object-position:bottom right;
  border-radius:1.2vw;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{
  font-family:"Satoshi","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
}

.stage{position:fixed;inset:0;padding:5vh 5vw;display:flex;align-items:center}
.list{
  list-style:none;margin:0;padding:0;width:100%;
  transition:opacity .16s ease,transform .22s ease;
}
.list.out{opacity:0;transform:translate3d(-1.2vw,0,0)}
body:not(.ready) .list{visibility:hidden}

.row{
  display:flex;align-items:center;
  width:fit-content;max-width:100%;
  height:calc(var(--fs)*1.38);
  cursor:pointer;
  animation:rise .8s var(--ease) backwards;
  animation-delay:calc(var(--i)*48ms);
}
@keyframes rise{from{opacity:0;transform:translate3d(-1.6vw,0,0)}}

.inner{
  display:flex;align-items:center;
  font-weight:900;font-size:var(--fs);line-height:1;letter-spacing:-.035em;
  color:var(--txt-lo);
  transform-origin:0 50%;
  transform:translate3d(0,0,0) scale(1);
  transition:transform .5s var(--ease),color .3s ease;
  will-change:transform;
}
.row.cur .inner{transform:translate3d(.6vw,0,0) scale(1.06)}

.label{display:inline-block;white-space:nowrap}
.settings .label{min-width:6.3em}

.meta{
  display:flex;align-items:center;gap:1.4vw;
  margin-left:2.6vw;
  font-weight:500;font-size:clamp(13px,2.1vh,22px);letter-spacing:.01em;line-height:1;
  transform:translateY(.25vh);
}
.url{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.url.empty{opacity:.5}
.tag{
  padding:.55em 1em;border:1.5px solid currentColor;border-radius:99px;
  font-weight:500;letter-spacing:.06em;
  transition:background-color .25s ease,color .25s ease,opacity .25s ease;
}
.tag:hover{background:var(--tag-hover)}
.size-btn{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;font-weight:900;letter-spacing:-.035em;padding:0 .15em;opacity:.5;transition:opacity .2s ease}
.size-btn:hover{opacity:1}
.hint{opacity:.55;letter-spacing:.06em}
.meta input{
  font:inherit;color:var(--txt-hi);background:transparent;border:0;outline:0;
  border-bottom:2px solid var(--input-border);
  padding:.55em 0;width:min(36vw,560px);caret-color:currentColor;
  transition:border-color .25s ease;
}
.meta input:focus{border-bottom-color:var(--txt-hi)}
.meta input.bad{animation:shake .32s ease;border-bottom-color:var(--txt-hi)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* launch / exit */
.leaving .row{pointer-events:none}
.leaving .row:not(.cur){
  opacity:0;transform:translate3d(0,-1.4vh,0);
  transition:opacity .22s ease,transform .3s ease;
  transition-delay:calc(var(--i)*16ms);
}
.leaving .row.cur{opacity:0;transition:opacity .18s ease .17s}
.leaving .row.cur .inner{transform:translate3d(1.4vw,0,0) scale(1.1)}

@media (prefers-reduced-motion:reduce){
  .row{animation-duration:.01s;animation-delay:0s}
  .inner,.list{transition-duration:.01s}
}

<body>
<main class="stage"><ul class="list" id="list" role="menu"></ul></main>
<div class="deco" id="deco"><img id="deco-img" src="" alt=""></div>
<div id="loader-overlay"><div class="loader-wrap"></div></div>

<script>
(function () {
  'use strict';

  /* ---------- config ---------- */
  var SERVICES = [
    { id: 'netflix',    label: 'netflix',    url: 'https://www.netflix.com' },
    { id: 'hulu',       label: 'hulu',       url: 'https://www.hulu.com' },
    { id: 'hboMax',     label: 'hboMax',     url: 'https://www.hbomax.com' },
    { id: 'primeVideo', label: 'primeVideo', url: 'https://www.primevideo.com' },
    { id: 'disney',     label: 'disney',     url: 'https://www.disneyplus.com' }
  ];
  var STORE_KEY = 'launcher.v1';

  /* ---------- state + storage ---------- */
  function freshState() {
    var s = { urls: {}, on: {}, watchlist: 'https://bennettchappelle.github.io/watchlist/', colorWeight: 50, textSize: 1 };
    SERVICES.forEach(function (v) { s.urls[v.id] = v.url; s.on[v.id] = true; });
    return s;
  }
  function normalize(v) {
    v = String(v || '').trim();
    if (!v) return '';
    if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(v)) v = 'https://' + v;
    try {
      var u = new URL(v);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      return u.href;
    } catch (e) { return null; }
  }
  function load() {
    var s = freshState();
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (raw && typeof raw === 'object') {
        SERVICES.forEach(function (v) {
          if (raw.urls && raw.urls[v.id]) { var n = normalize(raw.urls[v.id]); if (n) s.urls[v.id] = n; }
          if (raw.on && raw.on[v.id] === false) s.on[v.id] = false;
        });
            if (raw.watchlist) { var w = normalize(raw.watchlist); if (w) s.watchlist = w; }
            if (typeof raw.colorWeight === 'number') s.colorWeight = Math.max(0, Math.min(100, raw.colorWeight));
            if (typeof raw.textSize === 'number') s.textSize = Math.max(0.5, Math.min(2, raw.textSize));
      }
    } catch (e) {}
    return s;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  var state = load();
  function applyTextSize() { document.documentElement.style.setProperty('--fs-scale', state.textSize); }
  applyTextSize();

  /* ---------- audio ---------- */
  var ctx = null, dry = null, filt = null, unlocked = false;
  var PENT = [0, 2, 4, 7, 9];
  function freq(n) { return 130.81 * Math.pow(2, (Math.floor(n / 5) * 12 + PENT[n % 5]) / 12); }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var comp = ctx.createDynamicsCompressor();
      filt = ctx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 3200; filt.Q.value = .4;
      var master = ctx.createGain(); master.gain.value = .5;
      filt.connect(master);
      var dryG = ctx.createGain(); dryG.gain.value = .85;
      var wetG = ctx.createGain(); wetG.gain.value = .3;
      var conv = ctx.createConvolver();
      var len = Math.floor(ctx.sampleRate * 1.5), buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (var c = 0; c < 2; c++) {
        var d = buf.getChannelData(c);
        for (var k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3.2);
      }
      conv.buffer = buf;
      master.connect(dryG); dryG.connect(comp);
      master.connect(conv); conv.connect(wetG); wetG.connect(comp);
      comp.connect(ctx.destination);
      ctx.resume();
    } catch (e) { ctx = null; }
  }
  function voice(f, t, g) {
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    var env = ctx.createGain(), g2 = ctx.createGain();
    o1.type = 'triangle'; o1.frequency.value = f;
    o2.type = 'sine';     o2.frequency.value = f * 2;
    g2.gain.value = .25;
    env.gain.setValueAtTime(.0001, t);
    env.gain.exponentialRampToValueAtTime(.12 * g, t + .006);
    env.gain.exponentialRampToValueAtTime(.0001, t + .9);
    o1.connect(env); o2.connect(g2); g2.connect(env); env.connect(filt);
    o1.start(t); o2.start(t); o1.stop(t + .95); o2.stop(t + .95);
  }
  function chord(i) {
    var t = ctx.currentTime + .005, gs = [1, .72, .55];
    [i, i + 2, i + 4].forEach(function (n, j) { voice(freq(n), t + j * .016, gs[j]); });
  }
  function play(i) {
    if (!unlocked || !ctx) return;
    if (ctx.state === 'running') chord(i);
    else ctx.resume().then(function () { chord(i); }).catch(function () {});
  }

  /* ---------- view model ---------- */
  var list = document.getElementById('list');
  var view = 'main', rowsDef = [], rowEls = [], cur = 0;
  var editing = -1, busy = false, leaving = false, armed = false, armTimer = 0;

  function defs() {
    var r = [], settings = view === 'settings';
    SERVICES.forEach(function (v) {
      if (settings || state.on[v.id]) r.push({ kind: 'svc', id: v.id, label: v.label });
    });
    r.push({ kind: 'watchlist', id: 'watchlist', label: 'watchlist' });
    if (settings) {
      r.push({ kind: 'imgmgr', id: 'imgmgr', label: 'images' });
      r.push({ kind: 'textsize', id: 'textsize', label: 'text size' });
      r.push({ kind: 'reset', id: 'reset', label: 'reset' });
      r.push({ kind: 'back', id: 'back', label: 'back' });
    } else {
      r.push({ kind: 'settings', id: 'settings', label: 'settings' });
    }
    return r;
  }
  function indexOfId(id) {
    for (var i = 0; i < rowsDef.length; i++) if (rowsDef[i].id === id) return i;
    return 0;
  }
  function urlOf(r) { return r.kind === 'svc' ? state.urls[r.id] : state.watchlist; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function updateMeta(i) {
    var r = rowsDef[i], e = rowEls[i];
    if (!e || !e.meta) return;
    e.meta.textContent = '';
    var u = urlOf(r);
    e.meta.appendChild(el('span', 'url' + (u ? '' : ' empty'), u || 'not set'));
    if (r.kind === 'svc') {
      var tag = el('span', 'tag', state.on[r.id] ? 'on' : 'off');
      tag.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (editing >= 0 || leaving) return;
        setCur(i, true);
        toggle(i);
      });
      e.meta.appendChild(tag);
    }
  }

  function build() {
    list.textContent = '';
    rowEls = [];
    rowsDef = defs();
    list.classList.toggle('settings', view === 'settings');
    rowsDef.forEach(function (r, i) {
      var li = el('li', 'row');
      li.style.setProperty('--i', i);
      li.setAttribute('role', 'menuitem');
      var inner = el('div', 'inner');
      var label = el('span', 'label', r.label + '.');
      inner.appendChild(label);
      var meta = null;
      if (view === 'settings' && (r.kind === 'svc' || r.kind === 'watchlist')) {
        meta = el('span', 'meta');
        inner.appendChild(meta);
      }
      if (view === 'settings' && r.kind === 'textsize') {
        // replace label text with the two buttons
        label.textContent = '';
        var btnMinus = document.createElement('button');
        btnMinus.className = 'size-btn'; btnMinus.textContent = '−';
        var btnPlus = document.createElement('button');
        btnPlus.className = 'size-btn'; btnPlus.textContent = '+';
        label.appendChild(btnMinus);
        label.appendChild(btnPlus);
        (function bindSize() {
          function step(dir) {
            var v = Math.round((state.textSize + dir * 0.1) * 10) / 10;
            state.textSize = Math.max(0.5, Math.min(2, v));
            applyTextSize();
            save();
          }
          btnMinus.addEventListener('click', function(e) { e.stopPropagation(); step(-1); });
          btnPlus.addEventListener('click', function(e) { e.stopPropagation(); step(1); });
          btnMinus.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
          btnPlus.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
          btnMinus.addEventListener('pointermove', function(e) { e.stopPropagation(); });
          btnPlus.addEventListener('pointermove', function(e) { e.stopPropagation(); });
        })();
      }
      li.appendChild(inner);
      li.addEventListener('pointermove', function () {
        if (editing >= 0 || busy || leaving) return;
        setCur(i, true);
      });
      li.addEventListener('click', function () {
        if (editing >= 0 || busy || leaving) return;
        setCur(i, true);
        activate(i, false);
      });
      list.appendChild(li);
      rowEls.push({ li: li, inner: inner, label: label, meta: meta });
      updateMeta(i);
    });
    if (cur >= rowsDef.length) cur = rowsDef.length - 1;
    paint();
  }

  var ALPHA = [1, .44, .35, .3];
  var _txtRgb = '0,0,0';
  function paint() {
    rowEls.forEach(function (e, k) {
      var d = Math.abs(k - cur), a = ALPHA[Math.min(d, 3)], r = rowsDef[k];
      if (view === 'settings' && r.kind === 'svc' && !state.on[r.id]) a *= .55;
      e.inner.style.color = 'rgba(' + _txtRgb + ',' + a + ')';
      e.li.classList.toggle('cur', k === cur);
      e.li.setAttribute('aria-current', k === cur ? 'true' : 'false');
    });
  }
  function setCur(i, sound) {
    if (i === cur || i < 0 || i >= rowsDef.length) return;
    cur = i;
    paint();
    if (sound) play(i);
  }
  function move(dir) {
    var n = rowsDef.length;
    setCur((cur + dir + n) % n, true);
  }

  function show(v, targetId, then) {
    if (busy || leaving) return;
    busy = true;
    list.classList.add('out');
    setTimeout(function () {
      view = v;
      rowsDef = defs();
      cur = targetId ? indexOfId(targetId) : 0;
      build();
      list.classList.remove('out');
      busy = false;
      play(cur);
      if (then === 'edit') startEdit(cur);
    }, 170);
  }

  /* ---------- loader overlay ---------- */
  var LOADER_COUNT = 40;
  var lastLoader = 0;
  function showLoader() {
    var n;
    do { n = Math.floor(Math.random() * LOADER_COUNT) + 1; } while (n === lastLoader && LOADER_COUNT > 1);
    lastLoader = n;
    var wrap = document.querySelector('.loader-wrap');
    // replace element so animations restart cleanly
    wrap.innerHTML = '<div id="l' + n + '" style="filter:grayscale(1)"></div>';
    var ov = document.getElementById('loader-overlay');
    ov.classList.add('show');
  }

  /* ---------- actions ---------- */
  function go(url) {
    if (leaving) return;
    leaving = true;
    document.body.classList.add('leaving');
    showLoader();
    setTimeout(function () { window.location.href = url; }, 420);
  }

  function activate(i, viaSpace) {
    var r = rowsDef[i];
    if (!r) return;
    if (view === 'main') {
      if (r.kind === 'svc') return go(state.urls[r.id]);
      if (r.kind === 'watchlist') {
        if (state.watchlist) return go(state.watchlist);
        return show('settings', 'watchlist', 'edit');
      }
      if (r.kind === 'settings') return show('settings', null);
      return;
    }
    if (r.kind === 'svc' && viaSpace) return toggle(i);
    if (r.kind === 'svc' || r.kind === 'watchlist') return startEdit(i);
    if (r.kind === 'imgmgr') return go('image-manager.html');
    if (r.kind === 'textsize') return;
    if (r.kind === 'reset') return doReset(i);
    if (r.kind === 'back') return show('main', 'settings');
  }

  function toggle(i) {
    var r = rowsDef[i];
    if (!r || r.kind !== 'svc') return;
    state.on[r.id] = !state.on[r.id];
    save();
    updateMeta(i);
    paint();
  }

  function setLabel(i, text) {
    if (view === 'settings' && rowEls[i] && rowsDef[i] && rowsDef[i].kind === 'reset') {
      rowEls[i].label.textContent = text + '.';
    }
  }
  function doReset(i) {
    clearTimeout(armTimer);
    if (!armed) {
      armed = true;
      setLabel(i, 'sure?');
      armTimer = setTimeout(function () { armed = false; setLabel(i, 'reset'); }, 2600);
      return;
    }
    armed = false;
    state = freshState();
    applyTextSize();
    save();
    setLabel(i, 'done');
    rowEls.forEach(function (_, k) { updateMeta(k); });
    paint();
    armTimer = setTimeout(function () { setLabel(i, 'reset'); }, 1100);
  }

  /* ---------- inline edit ---------- */
  function startEdit(i) {
    var r = rowsDef[i], e = rowEls[i];
    if (!e || !e.meta || editing >= 0) return;
    editing = i;
    e.meta.textContent = '';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.spellcheck = false;
    inp.autocomplete = 'off';
    inp.setAttribute('autocapitalize', 'off');
    inp.placeholder = 'https://';
    inp.value = urlOf(r) || '';
    e.meta.appendChild(inp);
    e.meta.appendChild(el('span', 'hint', 'enter'));
    inp.focus();
    inp.select();
    var done = false;
    function finish() { done = true; editing = -1; updateMeta(i); }
    inp.addEventListener('keydown', function (ev) {
      ev.stopPropagation();
      if (ev.key === 'Enter') {
        ev.preventDefault();
        var v = inp.value.trim(), n;
        if (!v) n = (r.kind === 'svc') ? SERVICES[indexOfService(r.id)].url : '';
        else n = normalize(v);
        if (n === null) {
          inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
          return;
        }
        if (r.kind === 'svc') state.urls[r.id] = n; else state.watchlist = n;
        save();
        finish();
      } else if (ev.key === 'Escape') {
        ev.preventDefault();
        finish();
      }
    });
    inp.addEventListener('blur', function () { if (!done && editing === i) finish(); });
  }
  function indexOfService(id) {
    for (var i = 0; i < SERVICES.length; i++) if (SERVICES[i].id === id) return i;
    return 0;
  }

  /* ---------- input ---------- */
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) {
    window.addEventListener(t, unlock, { capture: true });
  });

  window.addEventListener('keydown', function (e) {
    if (editing >= 0 || busy || leaving) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case 'ArrowDown': e.preventDefault(); move(1); break;
      case 'ArrowUp':   e.preventDefault(); move(-1); break;
      case 'Tab':       e.preventDefault(); move(e.shiftKey ? -1 : 1); break;
      case 'Enter':     e.preventDefault(); if (!e.repeat) activate(cur, false); break;
      case ' ':         e.preventDefault(); if (!e.repeat) activate(cur, true); break;
      case 'Escape':    if (view === 'settings') { e.preventDefault(); show('main', 'settings'); } break;
    }
  });

  var lastT = 0, lastAbs = 0, trigT = 0, locked = false;
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (editing >= 0 || busy || leaving) return;
    var dy = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    var a = Math.abs(dy), t = performance.now();
    if (t - lastT > 140) locked = false;
    else if (locked && a > lastAbs + 8 && t - trigT > 300) locked = false;
    lastT = t; lastAbs = a;
    if (!locked && a >= 6) {
      move(dy > 0 ? 1 : -1);
      locked = true; trigT = t;
    }
  }, { passive: false });

  window.addEventListener('pageshow', function () {
    leaving = false;
    document.body.classList.remove('leaving');
  });

  /* ---------- deco ---------- */
  (function () {
    var PALETTE = ['#f8f9fa','#e9ecef','#dee2e6','#ced4da','#adb5bd','#6c757d','#495057','#343a40','#212529'];
    var COLOR_IMGS = [
      'images/color/_.jpeg',
      'images/color/486405f494719617d25ed1f999319faf.jpg',
      'images/color/980095937680040976.jpeg',
      'images/color/bc78deccf39886476de24d7c6c321eef.jpg',
      'images/color/be65147ce2be9dc44a37349821703c57.jpg',
      'images/color/C_O_P_R_A_6.jpeg',
      'images/color/kidsa_legalpagan_on_X.jpeg'
    ];
    var WHITE_IMGS = [
      'images/white/2a18388d7800ffc303248f82989e08d0.png',
      'images/white/310b72ee2a68699050769e4cce8c6177.png',
      'images/white/4e7ce5ac5ac9195c67dbf77724509adf.png',
      'images/white/762970424f7f19ac1703531778ef024f.png',
      'images/white/927d5bcf5e4f363c91886bc7a07949ea.png',
      'images/white/9a9a746171646351cf2c6c47f34a749f.png',
      'images/white/aa474fe996ff95719b0768595299be01.png',
      'images/white/c1e18cdd4d32853b63774303a450040b.png',
      'images/white/cd79b1b7519737ff08cacf244c75f706.png',
      'images/white/cf390a36c0bf02f296c662a4486b97a0.png',
      'images/white/e166f2e12c8c32fb4e5380192e997290.png'
    ];
    function pickExcluding(arr, exclude) {
      var pool = arr.length > 1 ? arr.filter(function(x) { return x !== exclude; }) : arr;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    var prev = {};
    try { prev = JSON.parse(sessionStorage.getItem('launcher.prev') || '{}'); } catch(e) {}

    var bg = pickExcluding(PALETTE, prev.bg);
    document.documentElement.style.setProperty('--bg', bg);
    var r = parseInt(bg.slice(1,3),16), g = parseInt(bg.slice(3,5),16), b2 = parseInt(bg.slice(5,7),16);
    var lum = 0.299*r + 0.587*g + 0.114*b2;
    var dark = lum < 128;
    var tc = dark ? '255,255,255' : '0,0,0';
    _txtRgb = tc;
    var root = document.documentElement;
    root.style.setProperty('--txt-hi',   'rgba('+tc+',1)');
    root.style.setProperty('--txt-mid',  'rgba('+tc+',.44)');
    root.style.setProperty('--txt-lo',   'rgba('+tc+',.3)');
    root.style.setProperty('--txt-xlo',  'rgba('+tc+',.28)');
    root.style.setProperty('--border',   'rgba('+tc+',.5)');
    root.style.setProperty('--input-border','rgba('+tc+',.4)');
    root.style.setProperty('--tag-hover','rgba('+tc+',.1)');

    // pick category based on user weight: colorWeight 0–100 = % chance of color image
    var cw = (typeof state !== 'undefined' && typeof state.colorWeight === 'number') ? state.colorWeight / 100 : 0.5;
    var src = pickExcluding(Math.random() < cw ? COLOR_IMGS : WHITE_IMGS, prev.img);

    try { sessionStorage.setItem('launcher.prev', JSON.stringify({ bg: bg, img: src })); } catch(e) {}
    var img = document.getElementById('deco-img');
    img.src = src;
  })();

  /* ---------- boot ---------- */
  function start() {
    if (document.body.classList.contains('ready')) return;
    build();
    document.body.classList.add('ready');
  }
  var fontsReady = (document.fonts && document.fonts.load)
    ? Promise.all([document.fonts.load('900 1em Satoshi'), document.fonts.load('500 1em Satoshi')])
    : Promise.resolve();
  fontsReady.then(start, start);
  setTimeout(start, 800);
})();
</script>
</body>
